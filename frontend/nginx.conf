# Кэш /auth/verify по заголовку Authorization: bcrypt намеренно медленный, а проверка
# выполняется на каждый запрос. Успех кэшируется на 5 минут, отказ — на 10 секунд.
proxy_cache_path /tmp/auth_cache levels=1:2 keys_zone=auth_cache:1m max_size=10m inactive=10m use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # HTTP Basic Auth для всего стенда: проверяет backend (GET /auth/verify),
    # пароли хранятся bcrypt-хешами в таблице users.
    auth_request /auth/verify;
    error_page 401 = @unauthorized;

    location = /auth/verify {
        internal;
        proxy_pass http://backend:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_cache auth_cache;
        proxy_cache_key "$http_authorization";
        proxy_cache_valid 200 5m;
        proxy_cache_valid 401 10s;
    }

    location @unauthorized {
        add_header WWW-Authenticate 'Basic realm="Ad Reporting"' always;
        return 401;
    }

    # Docker healthcheck — без авторизации.
    location = /healthz {
        auth_request off;
        default_type text/plain;
        return 200 "ok";
    }

    # /api/* -> backend:8000/*. Префикс отделяет API от SPA-маршрутов (например, /reports).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html всегда перепроверяется, чтобы после обновления браузер не показывал старую версию.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
